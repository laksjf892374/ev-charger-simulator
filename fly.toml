# fly.toml app configuration file generated for ev-charger-simulator on 2026-09-18T13:34:00-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ev-charger-simulator'
primary_region = 'sjc'

[env]
  # the hosted demo is for watching: a full charge takes under a minute
  SPEED = '60'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  # The simulation has a background clock and in-memory state, so it must be exactly one machine
  # that never sleeps: a second machine would be a second, different world.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
